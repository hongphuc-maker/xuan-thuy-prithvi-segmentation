[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xuan-thuy-prithvi-segmentation"
version = "0.1.0"
description = "Prithvi-EO-2.0 semantic segmentation experiments for Xuan Thuy"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Xuan Thuy Segmentation Research Team"},
]
keywords = [
  "foundation-model",
  "prithvi",
  "semantic-segmentation",
  "sentinel-2",
  "dmi-loss",
  "mathematical-morphology",
  "remote-sensing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
train = [
  "torch>=2.4,<3",
  "terratorch==1.2.12",
  "torchgeo==0.9.0",
  "timm==1.0.30",
  "segmentation-models-pytorch==0.5.0",
  "huggingface-hub==1.33.0",
  "einops==0.8.2",
  "rasterio==1.5.2",
  "pandas==2.2.3",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
  "geopandas>=1,<2",
  "tqdm>=4.66,<5",
  "xuan-thuy-dmi-segmentation @ git+https://github.com/hongphuc-maker/xuan-thuy-dmi-segmentation.git@0775770ae87b83b7d2982ed727226128685f3fba",
]
test = [
  "pytest>=8,<10",
]

[project.urls]
Homepage = "https://github.com/hongphuc-maker/xuan-thuy-prithvi-segmentation"
Repository = "https://github.com/hongphuc-maker/xuan-thuy-prithvi-segmentation"
Issues = "https://github.com/hongphuc-maker/xuan-thuy-prithvi-segmentation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
